# Builds the site and publishes it to GitHub Pages (https://<owner>.github.io/<repo>/) on every push to master.
# Moving to a custom domain later (e.g. botan.church): add public/CNAME with the domain and drop BASE_PATH below.
# The images aren't committed: `npm run art` (run by bake and build) makes them from source-art/, and
# `npm run bake` renders the intro animations with the runner's Chrome.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bake the intro animations
        run: npm run bake
        env:
          BROWSER: /usr/bin/google-chrome

      - name: Build
        run: npm run build
        env:
          # served from /<repo>/ (see src/lib/base.ts)
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA fallback: serve the app for deep links (/gospel, /fanart, …) too
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
